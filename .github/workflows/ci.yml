name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        name: Test + Build (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['20', '22']
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Lint
              run: npm run lint

            - name: Type-check
              run: npm run typecheck

            - name: Test (all workspaces)
              run: npm test --workspaces --if-present

            - name: Build (all workspaces)
              run: npm run build

            - name: Size budget
              run: npm run size

    bundle-size:
        name: Bundle size report
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'pull_request'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
            - run: npm ci --legacy-peer-deps
            - name: Build
              run: npm run build -w @vue-select-plus/core -w @vue-select-plus/vue
            - name: Report sizes
              run: |
                  echo "## Bundle sizes" >> "$GITHUB_STEP_SUMMARY"
                  echo "| Package | Size (raw) | Size (gzip) |" >> "$GITHUB_STEP_SUMMARY"
                  echo "| :-- | --: | --: |" >> "$GITHUB_STEP_SUMMARY"
                  for pkg in core vue; do
                      file="packages/$pkg/dist/index.js"
                      raw=$(stat -c%s "$file")
                      gz=$(gzip -c "$file" | wc -c)
                      printf "| @vue-select-plus/%s | %s B | %s B |\n" "$pkg" "$raw" "$gz" >> "$GITHUB_STEP_SUMMARY"
                  done
